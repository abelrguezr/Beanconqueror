name: Android CI Build

# Trigger on pushes to any branch and allow manual dispatch
on:
  push: {}
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (cmdline tools)
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          target: android-33
          build-tools: '33.0.2'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and install pnpm
        run: |
          # Remove packageManager field from package.json if present (avoid Corepack error)
          if [ -f package.json ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.packageManager){delete p.packageManager;fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('Removed packageManager from package.json')}"
          fi
          # Install pnpm directly to avoid Corepack/packageManager validation issues
          npm install -g pnpm@latest
          pnpm -v

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (pnpm)
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Capacitor sync Android
        run: pnpm exec cap sync android

      - name: Prepare Android build (make gradlew executable)
        run: chmod +x android/gradlew

      - name: Decode keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.jks
            ls -l android/app/my-release-key.jks
          else
            echo "No keystore provided — skipping decode."
          fi

      - name: Assemble release APK
        working-directory: android
        env:
          STORE_FILE: android/app/my-release-key.jks
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "$STORE_FILE" ]; then
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$STORE_FILE \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/**/*.apk
